<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>ZANY ZOO | Official Game</title>
<style>
:root{--green:#08794e;--dark:#061b16;--gold:#ffd43b;--orange:#ff8a24;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Bengali",Arial,sans-serif;background:#061b16;color:#fff}
body{background:radial-gradient(circle at 50% 0%,#176c4c 0,#092d22 42%,#041610 100%);min-height:100vh}
button{font:inherit;cursor:pointer}.site{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,4vw,42px);border-bottom:1px solid #ffffff20;background:#041610aa;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:1px;color:var(--gold);font-size:clamp(18px,4vw,25px)}
.brand img{width:42px;height:42px;object-fit:cover;border-radius:12px;border:2px solid var(--gold)}
.pill{border:1px solid #ffffff35;color:#e7fff3;padding:7px 12px;border-radius:30px;font-size:12px}
main{width:min(100% - 28px,980px);margin:auto;flex:1;padding:34px 0 50px}
.hero{text-align:center;padding:22px 0 28px}.logo{width:min(88%,510px);max-height:310px;object-fit:contain;border-radius:22px;filter:drop-shadow(0 15px 28px #0008);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:clamp(34px,8vw,66px);line-height:1.05;margin:14px 0 8px;color:var(--gold);text-shadow:0 4px 0 #a34d0a,0 9px 20px #0009;letter-spacing:2px}
.subtitle{color:#d2f5e4;font-size:clamp(14px,3vw,18px);margin:8px auto 6px;max-width:600px}
.creator{color:#ffdca0;font-size:14px;margin:12px 0 24px}
.actions{display:flex;justify-content:center;gap:13px;flex-wrap:wrap}.action{border:0;border-radius:15px;padding:14px 26px;font-weight:900;font-size:18px;min-width:155px;box-shadow:0 6px 0 #0005}
.action:active{transform:translateY(4px);box-shadow:0 2px 0 #0005}.play{background:linear-gradient(135deg,#ffe66d,#ffb800);color:#382000}
.download{background:linear-gradient(135deg,#24d58a,#07834f);color:white}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:34px 0 0}
.feature{background:#ffffff10;border:1px solid #ffffff20;border-radius:16px;padding:16px 10px;text-align:center;color:#e9fff3}
.feature b{display:block;font-size:25px;margin-bottom:5px}.feature span{font-size:13px}
footer{text-align:center;padding:18px;color:#b6d8c8;font-size:12px;border-top:1px solid #ffffff18}
.game-layer{position:fixed;inset:0;background:#000;z-index:20;display:none}.game-layer.show{display:block}
.game-frame{width:100%;height:100%;border:0;background:#061b16}
.game-tools{position:absolute;z-index:3;right:12px;top:12px;display:flex;gap:8px}
.tool{border:1px solid #ffffff55;background:#071d17dd;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}
.admin-link{position:fixed;right:14px;bottom:14px;z-index:8;border:1px solid #ffffff35;background:#102e24;color:#fff;border-radius:30px;padding:10px 15px;font-size:12px;text-decoration:none}
@media(max-width:520px){.features{grid-template-columns:1fr}.feature{padding:12px}.topbar{padding:10px 12px}main{padding-top:20px}.logo{max-height:260px}.action{width:100%}.actions{padding:0 12px}}
</style>
</head>

const DEFAULT_PASSWORD = "ZanyZoo@123";
const DEFAULTS = {
 title:"ZANY ZOO",
 description:"The Wildest Adventure! Catch fun items, dodge crazy obstacles and beat your high score.",
 creator:"Robiul Islam",
 logo:DEFAULT_LOGO,
 game:decodeURIComponent(escape(atob(DEFAULT_GAME_B64))),
 password:DEFAULT_PASSWORD
};
const STORAGE_KEY = "zanyZooSiteSettings";
let settings = {...DEFAULTS};
try {
 const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
 if(saved) settings={...settings,...saved};
} catch(e) {}
const $ = id => document.getElementById(id);
function render(){
 $("navTitle").textContent=settings.title;
 $("gameTitle").textContent=settings.title;
 $("footerTitle").textContent=settings.title;
 $("gameDescription").textContent=settings.description;
 $("creatorName").textContent=settings.creator;
 $("footerCreator").textContent=settings.creator;
 $("mainLogo").src=settings.logo || DEFAULT_LOGO;
 $("smallLogo").src=settings.logo || DEFAULT_LOGO;
 $("year").textContent=new Date().getFullYear();
 document.title=settings.title+" | Official Game";
}
function launchGame(){
 $("gameFrame").srcdoc=settings.game;
 $("gameLayer").classList.add("show");
 document.body.style.overflow="hidden";
}
function closeGame(){
 $("gameLayer").classList.remove("show");
 $("gameFrame").srcdoc="";
 document.body.style.overflow="";
 if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
$("playBtn").onclick=launchGame;
$("closeGame").onclick=closeGame;
$("fullBtn").onclick=async()=>{
 try { const f=$("gameFrame"); if(f.requestFullscreen) await f.requestFullscreen(); else if(f.webkitRequestFullscreen) f.webkitRequestFullscreen(); }
 catch(e){alert("আপনার ব্রাউজারে Full Screen চালু করা যায়নি।");}
};
$("downloadBtn").onclick=()=>{
 const blob=new Blob([settings.game],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=settings.title.replace(/[^a-z0-9-_]/gi,"_")+"_game.html";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY){try{settings={...DEFAULTS,...JSON.parse(e.newValue||"{}")};render();}catch(err){}}});
render();
</script>
